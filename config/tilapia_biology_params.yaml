# APF — Nile Tilapia (Oreochromis niloticus) Biology Parameters
# Sourced from literature. Cite the source comment on every line.
# DO NOT edit numbers without updating the source comment.

growth:
  # Temperature-dependent specific growth rate (SGR, % body weight / day)
  # Source: Mirea 2013 (Aquaculture) — full factorial 20/24/28/30 C x 30/35/40% protein
  # Optimal band where SGR is maximal
  sgr_optimal_temp_low_c: 29          # Mirea 2013: optimal 29-31 C
  sgr_optimal_temp_high_c: 31
  sgr_optimal_value_pct_per_day: 2.748 # Mirea 2013: 30 C / 40% protein = 2.748 %/day

  # Gompertz growth-model parameters (Supreme strain, most robust fit)
  # Source: Santos et al. 2013, Acta Scientiarum Animal Sciences 35(3):235-242
  gompertz:
    temp_22c:
      A_g: 122.1    # asymptotic weight
      K_per_day: 0.0882
    temp_28c:
      A_g: 981.8
      K_per_day: 0.0155
    temp_30c:
      A_g: 1068.5
      K_per_day: 0.0159

  # Exponential model growth-rate constants (K, from Figure 1, Supreme strain)
  # Source: Santos et al. 2013
  exponential_k_per_day:
    temp_22c: 0.0374
    temp_28c: 0.0431
    temp_30c: 0.0419

  # Thermal performance curve — Q10-style degradation outside optimum
  # Source: Nehemia 2012 / Mirea 2013 synthesis
  # Growth at 20-22 C is ~30 % of optimal; at 37 C growth significantly declines.
  q10_factor: 2.0
  sgr_at_20c_pct_of_optimal: 0.30

feed_conversion:
  # FCR ranges for extensive / semi-intensive pond culture
  # Source: FAO Fisheries Circular "Aquaculture of tilapias" (production-yield data)
  # NOTE: Direction of density effect is unresolved (tank vs cage studies disagree).
  #       Using neutral range until reconciled.
  fcr_extensive_low: 1.2
  fcr_extensive_high: 1.6
  fcr_semi_intensive_low: 1.4
  fcr_semi_intensive_high: 2.0
  fcr_intensive_low: 1.0
  fcr_intensive_high: 1.4

mortality:
  # Dissolved oxygen thresholds
  # Source: Fisheries 2022 (MDPI) — acute hypoxia mortality at 0.2 mg/L under heat stress
  #         General aquaculture consensus: < 3 mg/L is chronic stress, < 1.5 mg/L is lethal
  do_lethal_mg_l: 1.5
  do_critical_mg_l: 3.0
  do_stress_mg_l: 4.0

  # pH thresholds
  # Source: General tilapia water-quality literature
  ph_lethal_low: 4.0
  ph_lethal_high: 11.0
  ph_stress_low: 6.0
  ph_stress_high: 9.5
  ph_optimal_low: 6.5
  ph_optimal_high: 8.5

  # Temperature mortality thresholds
  # Source: Turker 2011 (upper lethal 35 C); Mirea 2013 (stress/disease 37-38 C)
  #         Frontiers Vet Sci 2022 (streptococcosis outbreaks at 32 C+)
  temp_lethal_high_c: 35.0
  temp_stress_high_c: 32.0
  temp_optimal_high_c: 30.0
  temp_optimal_low_c: 25.0
  temp_stress_low_c: 20.0
  temp_lethal_low_c: 11.0   # Mirea 2013: lethal minimum 10-11 C

  # Mortality penalty multipliers (per day) when outside safe range
  # These are approximations; calibrate against real pilot data when available.
  daily_mortality_rate_do_below_critical: 0.005
  daily_mortality_rate_do_below_lethal: 0.05
  daily_mortality_rate_temp_above_stress: 0.003
  daily_mortality_rate_temp_above_lethal: 0.04
  daily_mortality_rate_ph_outside_stress: 0.002
